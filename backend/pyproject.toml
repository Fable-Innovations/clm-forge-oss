[project]
name = "clm-forge"
version = "0.1.0"
description = "CLM Forge: find, train, evaluate and package CLM heads for a codebase"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "numpy>=1.26",
    "torch>=2.4",
    "mlx>=0.20",
    "mlx-lm>=0.32",
    "transformers>=4.51",
    "sympy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
    "python-statemachine>=2.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "ollama>=0.4",
    "claude-agent-sdk>=0.2",
    "anyio>=4",
    "scikit-learn>=1.5",
    "jinja2>=3.1",
    "markdown>=3.6",
    "build>=1.2",
    "hatchling>=1.25",
    "openai>=1.99",
    "regex>=2024.5",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
trace = ["mlflow>=2.16"]

[project.scripts]
forge-api = "forge.api:main"
forge = "forge.service:main"
forge-systemone = "forge.systemone:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
